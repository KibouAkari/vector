name: Documentation

on:
  pull_request:
    paths:
      - 'README.md'
      - 'VISION.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - 'docs/**'
      - 'scripts/check_docs.py'
      - 'scripts/tests/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/docs.yml'
      - 'public/vector-assets/brand/vector-mark.svg'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test documentation validator
        run: |
          python3 -m unittest discover \
            -s scripts/tests \
            -p 'test_*.py' -v

      - name: Validate documentation links and assets
        run: |
          python3 scripts/check_docs.py --root .
