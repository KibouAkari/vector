<svg xmlns="http://www.w3.org/2000/svg"
width="1200" height="548" viewBox="0 0 1200 548"
role="img" aria-label="Vector static architecture overview">
<defs>
<style>
.label{font:600 17px Arial,Helvetica,sans-serif;fill:#eaf2ee}
.sub{font:13px Arial,Helvetica,sans-serif;fill:#8fa99e}
.eyebrow{font:700 11px Arial,Helvetica,sans-serif;fill:#81d5ab;letter-spacing:1.8px}
.line{stroke:#527465;stroke-width:2;fill:none;stroke-linecap:round}
</style>
</defs>
<rect width="1200" height="548" rx="18" fill="#0c1114"/>
<rect x="24" y="24" width="1152" height="500"
rx="16" fill="none" stroke="#253630"/>

<text x="60" y="69" class="eyebrow">EXECUTION MODEL</text>
<text x="60" y="103" class="label" style="font-size:26px">
The simplest reliable path</text>
<text x="60" y="128" class="sub">
Requests become direct answers, deterministic artifacts,
or verified agent runs.</text>

<rect x="60" y="167" width="1080" height="62"
rx="11" fill="#17221f" stroke="#375748"/>
<text x="600" y="191" class="eyebrow"
text-anchor="middle">ENTRY POINTS</text>
<text x="600" y="215" class="label"
text-anchor="middle">
Chat · Projects · Automations · Future channels</text>
<path class="line" d="M600 229V255"/>
<path d="M594 249l6 8 6-8" fill="none"
stroke="#81d5ab" stroke-width="2"/>

<rect x="240" y="258" width="720" height="58"
rx="11" fill="#192520" stroke="#4d836a"/>
<text x="600" y="282" class="label"
text-anchor="middle">Intent &amp; policy router</text>
<text x="600" y="301" class="sub"
text-anchor="middle">
Capability · Privacy · Permission · Budget</text>
<path class="line"
d="M600 316V341M235 341H965M235 341V355M600 341V355M965 341V355"/>

<rect x="60" y="355" width="350" height="94"
rx="11" fill="#141c1e" stroke="#32413e"/>
<text x="82" y="380" class="eyebrow">01 / FAST</text>
<text x="82" y="407" class="label">Direct model call</text>
<text x="82" y="430" class="sub">
Simple answers and rewriting</text>

<rect x="425" y="355" width="350" height="94"
rx="11" fill="#141c1e" stroke="#32413e"/>
<text x="447" y="380" class="eyebrow">02 / ARTIFACT</text>
<text x="447" y="407" class="label">
Structured content + renderer</text>
<text x="447" y="430" class="sub">
Documents, files and media</text>

<rect x="790" y="355" width="350" height="94"
rx="11" fill="#141c1e" stroke="#32413e"/>
<text x="812" y="380" class="eyebrow">03 / AGENT</text>
<text x="812" y="407" class="label">
Plan · Tools · Verify</text>
<text x="812" y="430" class="sub">
Sandbox and elevated approvals</text>

<path class="line"
d="M235 449V470M600 449V470M965 449V470M235 470H965M600 470V483"/>

<rect x="240" y="483" width="720" height="31"
rx="9" fill="#183026" stroke="#4d836a"/>
<text x="600" y="503" class="label"
text-anchor="middle" style="font-size:14px">
Provider selection · Telemetry · Audit</text>
</svg>
